name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client + server)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Smoke-test the production server
        env:
          NODE_ENV: production
          PORT: '3100'
        run: |
          npx tsx server.ts &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/)
          API=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/does-not-exist)
          kill "$SERVER_PID"
          echo "GET / -> $CODE, GET /api/does-not-exist -> $API"
          test "$CODE" = "200"
          test "$API" = "404"

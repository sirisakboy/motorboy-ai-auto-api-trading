name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download fresh gradle-wrapper.jar
      run: |
        mkdir -p gradle/wrapper
        curl -f -L https://github.com/gradle/gradle/raw/v8.7/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        ls -l gradle/wrapper/gradle-wrapper.jar
        # Verify file size (should be around 300KB)
        [ $(stat -c%s gradle/wrapper/gradle-wrapper.jar) -gt 100000 ] || (echo "Jar file is too small or corrupt" && exit 1)

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="MotorBoy">
  <!--
    Favicon = the in-product mark (public/brand/motorboy-mark.svg), copied here
    so the long-standing /favicon.svg URL keeps working. Edit the brand file
    first, then copy; the shapes must stay identical.
    Ink on lavender is #0F1117 — never white on lavender (Brand Book AA rule).
  -->
  <defs>
    <linearGradient id="mb-lav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E80FF"/>
      <stop offset="1" stop-color="#7C6CFF"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="27" fill="url(#mb-lav)"/>
  <path d="M18 82V20H31L50 56L69 20H82V82H67V44L50 74L33 44V82Z" fill="#0F1117"/>
</svg>
